<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background (Rounded squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Glow behind Screen -->
  <rect x="76" y="96" width="360" height="240" rx="32" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- TV / Screen Bezel -->
  <rect x="76" y="96" width="360" height="240" rx="28" fill="url(#screenGrad)" stroke="#2e2e2e" stroke-width="6" />

  <!-- Screen Content Graphic: Digital Menu representation -->
  <!-- Header Bar -->
  <rect x="108" y="128" width="130" height="18" rx="9" fill="url(#emeraldGrad)" />
  <circle cx="396" cy="137" r="8" fill="#34d399" />

  <!-- Menu item row 1 -->
  <rect x="108" y="172" width="180" height="12" rx="6" fill="#888888" />
  <rect x="340" y="172" width="64" height="12" rx="6" fill="#34d399" />

  <!-- Menu item row 2 -->
  <rect x="108" y="204" width="150" height="12" rx="6" fill="#555555" />
  <rect x="340" y="204" width="64" height="12" rx="6" fill="#34d399" />

  <!-- Menu item row 3 -->
  <rect x="108" y="236" width="195" height="12" rx="6" fill="#555555" />
  <rect x="340" y="236" width="64" height="12" rx="6" fill="#34d399" />

  <!-- Menu item row 4 -->
  <rect x="108" y="268" width="135" height="12" rx="6" fill="#444444" />
  <rect x="340" y="268" width="64" height="12" rx="6" fill="#34d399" />

  <!-- TV Stand Neck & Base -->
  <rect x="236" y="342" width="40" height="42" rx="6" fill="#282828" stroke="#1c1c1c" stroke-width="2" />
  <rect x="176" y="382" width="160" height="18" rx="9" fill="url(#emeraldGrad)" />
</svg>