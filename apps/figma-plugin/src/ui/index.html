<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miniKast</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #f5f5f5;
      padding: 16px;
      font-size: 13px;
      user-select: none;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    p.subtitle { color: #888; font-size: 12px; line-height: 1.4; margin-bottom: 14px; }
    label.field-label {
      display: block; font-size: 11px; font-weight: 600; color: #aaa;
      margin-bottom: 6px; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.06em;
    }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 8px 10px;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 12px;
      outline: none; transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #666; }
    button {
      width: 100%; padding: 10px;
      border-radius: 7px; border: none;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #ffffff; color: #000000; }
    .btn-primary:hover:not(:disabled) { background: #e0e0e0; }
    .btn-secondary {
      background: transparent; color: #aaa;
      border: 1px solid #333; margin-top: 8px;
    }
    .btn-secondary:hover:not(:disabled) { background: #1a1a1a; color: #fff; }
    .btn-outline {
      background: rgba(255,255,255,0.05); color: #ddd;
      border: 1px solid #333; margin-top: 8px; font-size: 11px; padding: 7px;
    }
    .btn-outline:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; border-color: #555; }
    .status {
      margin-top: 12px; padding: 8px 10px;
      border-radius: 6px; font-size: 12px; line-height: 1.4;
      word-break: break-word;
    }
    .status.success { background: rgba(52, 199, 89, 0.12); color: #4cd964; border: 1px solid rgba(52, 199, 89, 0.3); }
    .status.error { background: rgba(255, 69, 58, 0.12); color: #ff5b52; border: 1px solid rgba(255, 69, 58, 0.3); }
    .status.loading { background: rgba(255, 255, 255, 0.06); color: #bbb; border: 1px solid #333; }
    .section { display: none; }
    .section.visible { display: block; }

    /* TV Display Specs Box */
    .specs-card {
      background: #141414;
      border: 1px solid #282828;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      margin-bottom: 12px;
    }
    .specs-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #777;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 12px;
    }
    .spec-item {
      display: flex;
      flex-direction: column;
    }
    .spec-item .label {
      font-size: 10px;
      color: #888;
    }
    .spec-item .val {
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>miniKast</h1>
  <p class="subtitle">Push digital menus directly to your TV</p>

  <!-- Connect section -->
  <div id="connect-section" class="section visible">
    <label class="field-label" for="token-input">API Token</label>
    <input id="token-input" type="password" placeholder="Paste token from dashboard" />

    <label class="field-label" for="app-url-input">App URL</label>
    <input id="app-url-input" type="text" value="http://localhost:3000" />

    <div style="margin-top: 16px">
      <button class="btn-primary" id="connect-btn">Connect</button>
    </div>
    <div id="connect-status"></div>
  </div>

  <!-- Push section -->
  <div id="push-section" class="section">
    <label class="field-label" for="tv-select">Target TV</label>
    <select id="tv-select">
      <option value="">Loading your TVs…</option>
    </select>

    <!-- TV Display Specs Card -->
    <div id="tv-specs-card" class="specs-card" style="display: none;">
      <div class="specs-title">TV Display Specs</div>
      <div class="specs-grid">
        <div class="spec-item">
          <span class="label">Resolution</span>
          <span class="val" id="spec-res">1920 × 1080</span>
        </div>
        <div class="spec-item">
          <span class="label">Aspect Ratio</span>
          <span class="val" id="spec-ratio">16:9</span>
        </div>
        <div class="spec-item">
          <span class="label">Orientation</span>
          <span class="val" id="spec-orient">Landscape</span>
        </div>
        <div class="spec-item">
          <span class="label">Display Code</span>
          <span class="val" id="spec-code" style="color: #4cd964;">-</span>
        </div>
      </div>
      <button class="btn-outline" id="create-frame-btn">📐 Create Matched Frame on Canvas</button>
    </div>

    <div style="margin-top: 14px">
      <button class="btn-primary" id="push-btn">Push Current Frame to TV</button>
      <button class="btn-secondary" id="disconnect-btn">Disconnect / Switch Account</button>
    </div>
    <div id="push-status"></div>
  </div>

  <script>
    let token = "";
    let appUrl = "http://localhost:3000";
    let tvs = [];
    let selectedTv = null;

    function showStatus(elId, msg, type) {
      const el = document.getElementById(elId);
      if (!msg) {
        el.innerHTML = "";
        return;
      }
      el.innerHTML = `<div class="status ${type}">${msg}</div>`;
    }

    function showConnectSection() {
      document.getElementById("connect-section").classList.add("visible");
      document.getElementById("push-section").classList.remove("visible");
      showStatus("connect-status", "", "");
    }

    function showPushSection() {
      document.getElementById("connect-section").classList.remove("visible");
      document.getElementById("push-section").classList.add("visible");
      showStatus("push-status", "", "");
      loadTvs();
    }

    function updateTvSpecs(tv) {
      selectedTv = tv;
      const specsCard = document.getElementById("tv-specs-card");
      if (!tv) {
        specsCard.style.display = "none";
        return;
      }

      specsCard.style.display = "block";
      const w = tv.screen_width || 1920;
      const h = tv.screen_height || 1080;
      const ratio = tv.aspect_ratio || "16:9";
      const orient = tv.orientation || (w >= h ? "Landscape" : "Portrait");

      document.getElementById("spec-res").textContent = `${w} × ${h}`;
      document.getElementById("spec-ratio").textContent = ratio;
      document.getElementById("spec-orient").textContent = orient;
      document.getElementById("spec-code").textContent = tv.pairing_code || "-";
      document.getElementById("create-frame-btn").textContent = `📐 Create ${w}×${h} Frame on Canvas`;
    }

    async function loadTvs() {
      const select = document.getElementById("tv-select");
      select.innerHTML = '<option value="">Loading TVs…</option>';
      const pushBtn = document.getElementById("push-btn");
      pushBtn.disabled = true;

      try {
        const cleanUrl = appUrl.replace(/\/+$/, "");
        const res = await fetch(`${cleanUrl}/api/tv/list`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        const data = await res.json();
        tvs = data.tvs || [];

        if (tvs.length === 0) {
          select.innerHTML = '<option value="">No paired TVs found. Pair one first!</option>';
          pushBtn.disabled = true;
          updateTvSpecs(null);
        } else {
          select.innerHTML = tvs
            .map((tv) => `<option value="${tv.id}">${tv.name || "TV"} (${tv.aspect_ratio || "16:9"})</option>`)
            .join("");
          pushBtn.disabled = false;
          updateTvSpecs(tvs[0]);
        }
      } catch (err) {
        console.error("loadTvs error:", err);
        select.innerHTML = '<option value="">Failed to load TVs</option>';
        showStatus("push-status", `Could not fetch TVs: ${err.message}`, "error");
        updateTvSpecs(null);
      }
    }

    document.getElementById("tv-select").addEventListener("change", (e) => {
      const tvId = e.target.value;
      const tv = tvs.find((t) => t.id === tvId);
      updateTvSpecs(tv || null);
    });

    document.getElementById("create-frame-btn").addEventListener("click", () => {
      if (!selectedTv) return;
      const w = selectedTv.screen_width || 1920;
      const h = selectedTv.screen_height || 1080;
      parent.postMessage({
        pluginMessage: {
          type: "create-frame",
          payload: {
            width: w,
            height: h,
            name: selectedTv.name || "TV",
          },
        },
      }, "*");
    });

    document.getElementById("connect-btn").addEventListener("click", async () => {
      const inputToken = document.getElementById("token-input").value.trim();
      const inputUrl = document.getElementById("app-url-input").value.trim();

      if (!inputToken) {
        showStatus("connect-status", "Please paste your API token from the dashboard.", "error");
        return;
      }
      if (!inputUrl) {
        showStatus("connect-status", "Please enter your App URL.", "error");
        return;
      }

      showStatus("connect-status", "Connecting to miniKast…", "loading");

      try {
        const cleanUrl = inputUrl.replace(/\/+$/, "");
        const res = await fetch(`${cleanUrl}/api/tv/list`, {
          headers: { Authorization: `Bearer ${inputToken}` },
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        token = inputToken;
        appUrl = cleanUrl;

        parent.postMessage({
          pluginMessage: {
            type: "save-credentials",
            payload: { token, appUrl },
          },
        }, "*");

        showPushSection();
      } catch (err) {
        console.error("Connect error:", err);
        showStatus("connect-status", `Connection failed: ${err.message}. Check your token and server.`, "error");
      }
    });

    document.getElementById("disconnect-btn").addEventListener("click", () => {
      token = "";
      document.getElementById("token-input").value = "";
      parent.postMessage({ pluginMessage: { type: "clear-credentials" } }, "*");
      showConnectSection();
    });

    document.getElementById("push-btn").addEventListener("click", () => {
      const tvId = document.getElementById("tv-select").value;
      if (!tvId) {
        showStatus("push-status", "Please select a TV first.", "error");
        return;
      }

      showStatus("push-status", "Processing menu…", "loading");
      parent.postMessage({
        pluginMessage: {
          type: "export-and-push",
          payload: { tvId, token, appUrl },
        },
      }, "*");
    });

    // Receive messages from plugin main thread
    window.onmessage = async (event) => {
      const msg = event.data?.pluginMessage;
      if (!msg) return;

      if (msg.type === "init-storage") {
        if (msg.payload?.appUrl) {
          appUrl = msg.payload.appUrl;
          document.getElementById("app-url-input").value = appUrl;
        }
        if (msg.payload?.token) {
          token = msg.payload.token;
          document.getElementById("token-input").value = token;
          showPushSection();
        }
      }

      if (msg.type === "status-msg") {
        showStatus("push-status", msg.message, "success");
      }

      if (msg.type === "upload") {
        const { bytes, fileName, tvId, token: t, appUrl: url } = msg.payload;

        showStatus("push-status", "Uploading menu image…", "loading");

        try {
          const cleanUrl = url.replace(/\/+$/, "");

          // 1. Get signed upload URL for the graphic asset
          const uploadRes = await fetch(`${cleanUrl}/api/menu/upload`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${t}`,
            },
            body: JSON.stringify({ tv_id: tvId, file_name: fileName, content_type: "image/png" }),
          });

          if (!uploadRes.ok) {
            const errData = await uploadRes.json().catch(() => ({}));
            throw new Error(errData.error || `Upload URL request failed (HTTP ${uploadRes.status})`);
          }

          const { upload_url, public_url } = await uploadRes.json();

          // 2. Upload asset directly to Supabase Storage
          const putRes = await fetch(upload_url, {
            method: "PUT",
            headers: { "Content-Type": "image/png" },
            body: new Uint8Array(bytes),
          });

          if (!putRes.ok) {
            throw new Error(`Storage upload failed (HTTP ${putRes.status})`);
          }

          // 3. Trigger push to TV
          showStatus("push-status", "Broadcasting menu to TV…", "loading");
          const pushRes = await fetch(`${cleanUrl}/api/menu/push`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${t}`,
            },
            body: JSON.stringify({
              tv_id: tvId,
              image_url: public_url,
              menu_mode: "static",
              menu_data: null,
            }),
          });

          if (!pushRes.ok) {
            const errData = await pushRes.json().catch(() => ({}));
            throw new Error(errData.error || `Push trigger failed (HTTP ${pushRes.status})`);
          }

          showStatus("push-status", "✓ Pushed successfully to TV!", "success");
        } catch (err) {
          console.error("Upload error:", err);
          showStatus("push-status", `Push failed: ${err.message}`, "error");
        }
      }

      if (msg.type === "error") {
        showStatus("push-status", msg.message, "error");
      }
    };
  </script>
</body>
</html>
